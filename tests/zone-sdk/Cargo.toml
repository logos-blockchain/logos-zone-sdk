[package]
categories  = { workspace = true }
description = "ZoneSDK integration tests"
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "logos-blockchain-zone-tests"
publish     = false
repository  = { workspace = true }
version     = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
cucumber               = { features = ["macros", "output-junit"], workspace = true }
lb-testing-framework   = { workspace = true }
logos-blockchain-tests = { workspace = true }
tokio                  = { features = ["macros", "rt-multi-thread"], workspace = true }

[features]
cucumber = []

[[test]]
harness           = false
name              = "cucumber"
path              = "tests/cucumber.rs"
required-features = ["cucumber"]
