# Config file reference can be found at https://embarkstudios.github.io/cargo-deny/checks/cfg.html.

[graph]
all-features = true
exclude-dev  = false

[advisories]
# When adding a new line, please consider to which group the advisory belongs, and whether the issue can be fixed by upgrading some dependencies.
ignore = [
  # Unmaintained deps. To review periodically to check if they can be removed with an upgrade.
  { id = "RUSTSEC-2024-0388", reason = "`derivative` is unmaintained. No workspace crate depends on it directly. Pulled in via `ark-groth16` -> `ark-crypto-primitives`, which requires it non-optionally in both 0.5 and 0.6, so no arkworks upgrade can drop it. Re-evaluate this entry on future arkworks releases." },
  { id = "RUSTSEC-2024-0436", reason = "`paste` is unmaintained. No workspace crate depends on it directly. Pulled in via `ark-ff` 0.5 (removed in 0.6, which needs jellyfish/`jf-poseidon2` on arkworks 0.6 first) and via `netlink-packet-core` 0.8 behind libp2p's `if-watch` (removed in 0.9, but `if-watch` 3.2.2 still requires ^0.8.1). Re-evaluate this entry in the future and drop it once/if both are gone." },
  # Vulnerable deps, affecting our production code. To review periodically to check if they can be removed with an upgrade.
  { id = "RUSTSEC-2026-0119", reason = "`hickory-proto` O(n^2) name compression during DNS message *encoding* (no feature gate, so the code is present). We use it only as a stub resolver behind `libp2p` `.with_dns()`, encoding small outbound queries rather than many-record responses, so exposure is low. Fixed in `hickory-proto` 0.26.1+, but this workspace uses `libp2p` 0.56 and `libp2p-dns` 0.44, which require Hickory 0.25. Remove this exception after the Libp2p/Hickory dependency upgrade." },
  # Temporary risk acceptance until the Libp2p stack upgrades to Hickory >= 0.26.2 and libp2p-gossipsub >= 0.50.1 (both need libp2p 0.57).
  { id = "RUSTSEC-2026-0491", reason = "`hickory-proto` 0.25.2 can over-allocate memory while decoding untrusted DNS packets. This path is used by the node's Libp2p DNS resolver, so this is an accepted risk rather than an inapplicable advisory. Temporarily accepted while the node remains on `libp2p` 0.56 / Hickory 0.25; remove after the dependency upgrade brings `hickory-proto` >= 0.26.2." },
  { id = "RUSTSEC-2026-0534", reason = "`libp2p-gossipsub` 0.49.5 keeps backoff state for PRUNE messages on topics it is not subscribed to, so a peer can grow that state without bound. The node's gossipsub layer is this crate, so this is an accepted risk rather than an inapplicable advisory. Fixed in `libp2p-gossipsub` 0.50.1, which requires `libp2p-swarm` 0.48 and so `libp2p` 0.57; remove after the libp2p upgrade." },
  # Unmaintained deps. Acknowledged but a replacement has not been decided yet.
  { id = "RUSTSEC-2024-0449", reason = "`unsafe-libyaml` is unmaintained. Pulled in via deprecated `serde_yaml` 0.9, used by workspace crates and by `kube-client` and `cfgsync-core`, so migrating the workspace alone won't drop it." },
  { id = "RUSTSEC-2025-0141", reason = "`bincode` is unmaintained but continuing to use it." },

  # Vulnerable deps, not affecting our production code.
  { id = "RUSTSEC-2026-0118", reason = "`hickory-proto` unbounded NSEC3 closest-encloser loop. NOT APPLICABLE to our build: the advisory requires the `dnssec-ring` or `dnssec-aws-lc-rs` feature, and the only features we enable on `hickory-proto` 0.25.2 are `std`, `tokio` and `futures-io`, so the vulnerable validator is not compiled in. Kept only because cargo-deny matches on crate version, not enabled features. Reached solely via `libp2p` -> `libp2p-dns` -> `hickory-resolver`." },
  { id = "RUSTSEC-2026-0487", reason = "`hickory-proto` can panic while parsing a malformed SVCB/HTTPS `alpn` value from zone-file text. The node's Libp2p DNS resolver uses the DNS wire format; we do not parse untrusted zone files with these text parsers. Remove after upgrading `hickory-proto` to >= 0.26.2." },
  { id = "RUSTSEC-2026-0489", reason = "`hickory-proto` can panic while parsing a lone quote in an SVCB/HTTPS parameter from zone-file text. The node's Libp2p DNS resolver uses the DNS wire format; we do not parse untrusted zone files with these text parsers. Remove after upgrading `hickory-proto` to >= 0.26.2." },
  { id = "RUSTSEC-2026-0490", reason = "`hickory-proto` can panic on a zone-file token of 4096 or more characters. The node's Libp2p DNS resolver does not use this zone-file lexer, and we do not parse untrusted zone files with it. Remove after upgrading `hickory-proto` to >= 0.26.2." },
  { id = "RUSTSEC-2026-0504", reason = "`hickory-proto` inverted NSEC3 comparison in DNSSEC validation. NOT APPLICABLE to our build: DNSSEC validation lives in `hickory-proto`'s `dnssec` module, compiled only with the `dnssec-ring` or `dnssec-aws-lc-rs` feature, and the only features we enable on `hickory-proto` 0.25.2 are `std`, `tokio` and `futures-io`, so the validator is not compiled in. Kept only because cargo-deny matches on crate version, not enabled features. Reached solely via `libp2p` -> `libp2p-dns` -> `hickory-resolver`. Remove after the Libp2p/Hickory dependency upgrade." },
  { id = "RUSTSEC-2026-0505", reason = "`hickory-proto` NSEC3 owner names not checked against the zone in DNSSEC validation. NOT APPLICABLE to our build: DNSSEC validation lives in `hickory-proto`'s `dnssec` module, compiled only with the `dnssec-ring` or `dnssec-aws-lc-rs` feature, and the only features we enable on `hickory-proto` 0.25.2 are `std`, `tokio` and `futures-io`, so the validator is not compiled in. Kept only because cargo-deny matches on crate version, not enabled features. Reached solely via `libp2p` -> `libp2p-dns` -> `hickory-resolver`. Remove after the Libp2p/Hickory dependency upgrade." },
  { id = "RUSTSEC-2026-0511", reason = "`hickory-proto` NXDOMAIN accepted for a proven empty non-terminal in DNSSEC validation. NOT APPLICABLE to our build: DNSSEC validation lives in `hickory-proto`'s `dnssec` module, compiled only with the `dnssec-ring` or `dnssec-aws-lc-rs` feature, and the only features we enable on `hickory-proto` 0.25.2 are `std`, `tokio` and `futures-io`, so the validator is not compiled in. Kept only because cargo-deny matches on crate version, not enabled features. Reached solely via `libp2p` -> `libp2p-dns` -> `hickory-resolver`. Remove after the Libp2p/Hickory dependency upgrade." },
  { id = "RUSTSEC-2026-0512", reason = "`hickory-proto` DNSSEC validation accepted an unrelated signed RRset as the answer. NOT APPLICABLE to our build: DNSSEC validation lives in `hickory-proto`'s `dnssec` module, compiled only with the `dnssec-ring` or `dnssec-aws-lc-rs` feature, and the only features we enable on `hickory-proto` 0.25.2 are `std`, `tokio` and `futures-io`, so the validator is not compiled in. Kept only because cargo-deny matches on crate version, not enabled features. Reached solely via `libp2p` -> `libp2p-dns` -> `hickory-resolver`. Remove after the Libp2p/Hickory dependency upgrade." },
  { id = "RUSTSEC-2026-0514", reason = "`hickory-resolver` `lookup`/`lookup_ip` returned records that failed DNSSEC validation. NOT APPLICABLE to our build: the validating resolver (`LookupEither::Secure`) is compiled only with the `dnssec-ring` or `dnssec-aws-lc-rs` feature, and the only features we enable on `hickory-resolver` 0.25.2 are `system-config` and `tokio`, so no lookup validates DNSSEC. Kept only because cargo-deny matches on crate version, not enabled features. Reached solely via `libp2p` -> `libp2p-dns`. Remove after the Libp2p/Hickory dependency upgrade." },
  { id = "RUSTSEC-2026-0530", reason = "`hickory-proto` parent-side NSEC at a zone cut accepted as proof of nonexistence in DNSSEC validation. NOT APPLICABLE to our build: DNSSEC validation lives in `hickory-proto`'s `dnssec` module, compiled only with the `dnssec-ring` or `dnssec-aws-lc-rs` feature, and the only features we enable on `hickory-proto` 0.25.2 are `std`, `tokio` and `futures-io`, so the validator is not compiled in. Kept only because cargo-deny matches on crate version, not enabled features. Reached solely via `libp2p` -> `libp2p-dns` -> `hickory-resolver`. Remove after the Libp2p/Hickory dependency upgrade." },
  { id = "RUSTSEC-2026-0531", reason = "`hickory-proto` child-side NSEC/NSEC3 accepted as proof that a delegation has no DS record in DNSSEC validation. NOT APPLICABLE to our build: DNSSEC validation lives in `hickory-proto`'s `dnssec` module, compiled only with the `dnssec-ring` or `dnssec-aws-lc-rs` feature, and the only features we enable on `hickory-proto` 0.25.2 are `std`, `tokio` and `futures-io`, so the validator is not compiled in. Kept only because cargo-deny matches on crate version, not enabled features. Reached solely via `libp2p` -> `libp2p-dns` -> `hickory-resolver`. Remove after the Libp2p/Hickory dependency upgrade." },
  { id = "RUSTSEC-2026-0532", reason = "`hickory-proto` parent-side NSEC3 at a zone cut accepted as proof of nonexistence in DNSSEC validation. NOT APPLICABLE to our build: DNSSEC validation lives in `hickory-proto`'s `dnssec` module, compiled only with the `dnssec-ring` or `dnssec-aws-lc-rs` feature, and the only features we enable on `hickory-proto` 0.25.2 are `std`, `tokio` and `futures-io`, so the validator is not compiled in. Kept only because cargo-deny matches on crate version, not enabled features. Reached solely via `libp2p` -> `libp2p-dns` -> `hickory-resolver`. Remove after the Libp2p/Hickory dependency upgrade." },
]
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
yanked = "deny"

[bans]
allow-wildcard-paths = false
multiple-versions    = "allow"

[bans.std-replacements]
level = "deny"
scope = "workspace"

[bans.workspace-dependencies]
duplicates = "deny"
unused     = "deny"

[licenses]
allow = [
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "BlueOak-1.0.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
private = { ignore = false }
unused-allowed-license = "deny"
unused-license-exception = "deny"

[sources]
allow-git = [
  "https://github.com/EspressoSystems/jellyfish.git",
  "https://github.com/arkworks-rs/spongefish.git",
  "https://github.com/logos-blockchain/logos-blockchain-circuits.git",
  "https://github.com/logos-blockchain/logos-blockchain-module.git",
  "https://github.com/logos-blockchain/logos-blockchain-rust-rapidsnark.git",
  "https://github.com/logos-blockchain/logos-blockchain-testing.git",
  "https://github.com/logos-blockchain/logos-blockchain.git",
]
required-git-spec = "tag"
unknown-git = "deny"
unknown-registry = "deny"
unused-allowed-org = "deny"
unused-allowed-source = "deny"

[sources.allow-org]
github = ["logos-co"]
